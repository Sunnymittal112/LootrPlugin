#  Configuration File - Author: FeTaL

general:
  prefix: "&6[&eLootr&6] &r"
  debug: false
  # Not used yet: there is no translation system. Player messages can be changed in the messages section below.
  language: "en"

# ═══════════════════════════════════════════
#         ★ COMPATIBILITY SETTINGS ★
# ═══════════════════════════════════════════
compatibility:
  ignore-quickshop: true
  ignore-metadata-chests: false
  metadata-blacklist:
    - "hikari-shop"
    - "quickshop"
    - "qs-shop"
    - "chestshop"
    - "shopchest"
    - "guishop"
  ignore-chest-names-containing:
    - "$"
    - "Shop"
    - "Buy"
    - "Sell"
    - "§"
  wait-for-quickshop: 5

# Lootr does not create loot tables, it only reads tables the server has loaded.
# Custom loot tables go in a datapack in your main world's datapacks folder
# (the folder is printed in the console on startup):
#   <world>/datapacks/<pack>/data/<namespace>/loot_table/chests/<name>.json
# Then use them with /lootr register <namespace>:chests/<name>. See the README for details.
loot:
  per-player-loot: true
  max-tracked-chests: 50000
  # Tab-complete every vanilla loot table, not just chest and pot tables. Gameplay tables (fishing,
  # cat gifts) and mob drop tables work in a chest; block and interaction tables don't, and register
  # and settable refuse them. Some tables are empty (e.g. axolotl drops nothing). See the README.
  # Any table can still be typed by name with this off.
  suggest-all-vanilla-tables: false
  disabled-worlds:
    - "creative"
    - "lobby"
    - "hub"
    - "spawn"

inventory:
  title: "&8[&6✦&8] &eLoot Chest"
  play-sound: true

protection:
  prevent-break: true
  prevent-hopper: true
  prevent-explosion: true
  prevent-piston: true
  break-confirm-time: 3
  exclude-shop-protection: true
  bypass-protection: true

visuals:
  particles-enabled: true
  particle-type: "HAPPY_VILLAGER"
  particles-only-unlooted: true
  particles-exclude-shops: true

storage:
  auto-save-interval: 5

# Set first-open or already-looted to "" to turn that message off.
# already-looted only shows when the player's copy of the chest is empty.
messages:
  first-open: "&aThis chest has unique loot just for you!"
  already-looted: "&7You have already looted this chest."
  cannot-break: "&cYou cannot break this chest!"
  break-confirm: "&eBreak again within 3 seconds to confirm!"
  chest-broken: "&aLootr chest removed!"
  no-permission: "&cYou don't have permission to do this!"
  shop-ignored: "&7This is a shop chest and will not be registered as Lootr."
