name: LootrPlugin
version: ${project.version}
main: com.fetal.lootr.LootrPlugin
api-version: '26.3'
description: Per-player unique loot from structure chests with shop plugin compatibility
authors: [FeTaL]

softdepend: 
  - GriefPrevention
  - QuickShop-Hikari
  - QuickShop
  - ChestShop
  - ShopChest
  - GUIShop

commands:
  lootr:
    description: LootrPlugin admin commands
    usage: /<command> [reload|info|stats|clear|reset|list|register|settable|unregister]
    permission: lootr.admin
    aliases: [loot, lr]

permissions:
  lootr.admin:
    description: Full admin access
    default: op
  lootr.break:
    description: Can break Lootr chests
    default: op
  lootr.bypass:
    description: Bypass Lootr system
    default: false

